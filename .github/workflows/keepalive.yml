name: Keep Supabase Alive

on:
  schedule:
    # Every 3 days -- comfortably under Supabase's 7-day inactivity pause window,
    # with margin in case a scheduled run is delayed or skipped.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install pg

      - run: node scripts/keepalive.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
